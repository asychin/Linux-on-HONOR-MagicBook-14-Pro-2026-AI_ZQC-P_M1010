# HONOR MagicBook Pro 14 2026 (AI), board M1010.
name=EC fan tachometers
# Where the two 16-bit little-endian tachometers sit in EC RAM. Read out of this
# board's own DSDT, where Offset (0x2C) is followed by FA0L, FA0R, FA1L, FA1R.
# The installer passes them to the module as fan0= and fan1=, so the module
# itself carries no board of its own.
ec_fan0=0x2c
ec_fan1=0x2e
status=verified
origin=this repository, read from the DSDT and confirmed against the spinning fans
