# HONOR MagicBook Pro 14 2026 (AI), board M1050.
#
# The panel is the same one: this board's VBT differs from M1010's factory blob
# at exactly the two bytes patch/oled-backlight/ writes, and nowhere else in
# 7680. So the same floor is the right starting point.
#
# 12 is here because this board ran with it. The install log in issue 11 shows
# this fix patching that machine's own factory VBT from 6/255 to 12/255 and
# installing the blob, and its owner has not reported a problem with the low end
# of the range since. That is weaker than somebody stepping through
# measure-floor.sh and saying where the tint stops, and it is what there is.
name=OLED backlight floor
backlight_min=12
status=reported
origin=issue 11: applied on that machine and left in place, not measured by eye there
