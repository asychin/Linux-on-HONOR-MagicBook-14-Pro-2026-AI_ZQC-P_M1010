# HONOR MagicBook Pro 14 2026 (AI), board M1010.
name=OLED backlight floor
# The VBT declares a 2.4% minimum this panel cannot render evenly: below this
# level it goes green and blotchy. Raised to 12/255, which is the first step
# where the tint and the blotches are gone. Somebody had to sit and look at the
# screen to get this number; it is not readable off the machine.
backlight_min=12
status=verified
origin=this repository, measured by eye with patch/oled-backlight/measure-floor.sh
