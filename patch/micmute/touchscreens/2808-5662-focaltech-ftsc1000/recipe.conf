# FocalTech FTSC1000 2808:5662 - HONOR MagicBook Pro 14 2026 (ZQC-P), Pro 14
# 2025 (FMB-P), Art 14 (MRA-XXX, MRB-XXX)
name=FocalTech FTSC1000 2808:5662
# The program is built with -DHID_VID and -DHID_PID taken from the id actually
# found on the bus, so this file compiles for any unit carrying the same chip.
program=honor-ftsc1000-micmute.bpf.c
# What the vendor collection is, and why it has to be a per-touchscreen recipe:
# the fixup rewrites usage page 0xff01 where it is used for a wide variable data
# field. That is a statement about this chip's report descriptor. Another
# touchscreen putting something else on that page needs its own program, not a
# wider match here.
status=verified
origin=this repository, measured on ZQC-P M1010
