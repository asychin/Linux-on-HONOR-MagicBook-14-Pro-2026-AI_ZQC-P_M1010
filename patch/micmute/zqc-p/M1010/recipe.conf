# HONOR MagicBook Pro 14 2026 (AI), board M1010.
name=FocalTech FTSC1000 2808:5662
# What this directory was written against. The installer looks at the bus and
# refuses if the touchscreen fitted is a different one: the profile records what
# a board usually ships, the bus records what it shipped.
device=2808:5662
# The program is built with -DHID_VID and -DHID_PID taken from the id actually
# found, so the same source compiles for any unit carrying this chip.
program=honor-ftsc1000-micmute.bpf.c
# Why the program is per machine rather than one wider match: the fixup rewrites
# usage page 0xff01 where it is used for a wide variable data field. That is a
# statement about this chip's report descriptor, and another touchscreen putting
# something else on that page needs its own program.
status=verified
origin=this repository, measured on ZQC-P M1010
