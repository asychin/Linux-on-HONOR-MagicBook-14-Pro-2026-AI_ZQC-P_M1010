# HONOR MagicBook Pro 14 2026 (AI), board M1050.
#
# The ACPI path is identical firmware, SBCM writing CHMD at EC 0x85, checked
# against the tables in issue 11. Which pairs the EC then arms is decided inside
# EC firmware and is not visible in those tables, so these pairs are still the
# ones measured on M1010.
#
# What makes that acceptable rather than a guess: the installer writes the pair
# and then reads EC 0x85 back, and says in as many words if the EC did not arm
# itself. A wrong pair here produces a message, not a misconfigured battery.
# This fix ran on that machine from the flat profile and reported no such
# message. Replacing "no complaint" with a measurement is one command per pair,
# in docs/TESTING.md.
name=EC charge presets
presets=40-70 70-90 95-100
status=reported
origin=issue 11: ran on that machine, the pairs themselves inherited from M1010
