# HONOR MagicBook Pro 14 2026 (AI), board M1010.
name=EC charge presets
# The EC enforces only the pairs HONOR PC Manager offers and silently ignores
# every other one, so a perfectly reasonable 75-80 leaves the machine charging
# to 100%. These are the pairs that arm, checked at EC 0x85 after writing each.
presets=40-70 70-90 95-100
status=verified
origin=this repository, each pair written and then read back at EC 0x85
