# HONOR MagicBook Pro 14 2025 (FMB-P), board revision unknown.
#
# `any` rather than a revision, because the report this came from named the
# model and not the board. FMB-P has five revisions in its profile and none of
# them has been described in enough detail to say which carries this reader.
# Narrow this to a revision the moment somebody does.
name=FPC 10a5:9924
device=10a5:9924
driver=fpcmoc
source=distro
# Three takes on the same sensor.
#
#   default  the minimal patch carried forward to libfprint 1.94.100. fpcmoc was
#            restructured there, so the original no longer applied to anything
#            current. Rebased here, compiles clean, and the built library lists
#            the sensor. Not verified on the sensor itself.
#   old      the original, for distributions still on 1.94.9 or 1.94.10.
#   full     a larger independent effort: a 9924-specific session-init sequence
#            and 16-byte binary identity handling. Try it if enrolment fails.
#            Applies to 1.94.10 only.
patches=0001-fpcmoc-add-10a5-9924-for-libfprint-1.94.100.patch
patches_old=0001-fpcmoc-add-10a5-9924-minimal.patch
patches_full=0001-fpcmoc-add-10a5-9924-full-session-init.patch
applies_to=1.94.100
applies_to_old=1.94.9 1.94.10
applies_to_full=1.94.10
# Known limitation of the default and old patches: the sensor answers with an
# opaque per-enrolment token, so with several fingers enrolled IDENTIFY reports
# the first template rather than the one presented. The device really did match
# an enrolled finger; the token does not say which. VERIFY is unaffected.
status=reported
origin=colorcube/Linux-on-Honor-Magicbook-14-Pro PR #21 by tsukasagenesis (minimal, and the rebase is that work carried forward); Terrydaktal/libfprint-fpc-10a5-9924 (full)
