# HONOR MagicBook Pro 14 2026 (AI), board M1010. Global units of this model
# ship the Goodix reader; the Chinese ones ship an EgisTec, which is why this
# directory is keyed on the board and not on the model.
name=Goodix 27c6:6f94
# What this directory was written against. The installer looks at the USB bus
# and refuses on a mismatch.
device=27c6:6f94
driver=goodixmoc
# distro: patch the distribution's own libfprint package and let the package
# manager keep owning the files.
source=distro
patches=0001-goodixmoc-add-27c6-6f94.patch
# libfprint releases the patch was checked against, here, with `patch -F3`.
applies_to=1.94.10 1.94.100
status=verified
origin=this repository
