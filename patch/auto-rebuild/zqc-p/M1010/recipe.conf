# HONOR MagicBook Pro 14 2026 (AI), board M1010.
name=Package-manager hooks that re-apply the fixes after an update
# Nothing about this is per machine; it follows from what else the board lists.
# The directory exists so every fix is looked up the same way and so a board
# that should not have it is visible by not having one.
follows=any listed fix that builds a kernel module or rebuilds a library
status=verified
origin=this repository, running on ZQC-P M1010
