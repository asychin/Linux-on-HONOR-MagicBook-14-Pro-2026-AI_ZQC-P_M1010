# HONOR MagicBook Pro 14 2026 (AI), board M1010.
name=eDP driven at 6 bpc because DSC is never tried
# 3120x2080 at 120 Hz is 900.864 MHz of pixel clock. HBR2 over four lanes gives
# 17.28 Gbit/s, which is 19.1 bits per pixel, so without DSC the driver falls to
# 6 bpc. The panel advertises DSC and the link never asks for it.
seen=i915_dsc_fec_support reports DSC_Sink_Support yes with DSC_Enabled no
status=verified
origin=this repository, read off the eDP debugfs on ZQC-P M1010
