# HONOR MagicBook Pro 14 2026 (AI), board M1010.
name=ALC256 headset microphone on the 3.5 mm jack
# The codec subsystem id the quirk keys on. The installer reads it off the
# running machine and refuses on a mismatch, so this directory cannot hand a
# foreign pin configuration to somebody else's codec.
device=1ee7:209d
patch=alc269-headset-mic.patch
# Which alc269.c fixup this board needs. Found by trying them: the stock
# ALC2XX_FIXUP_HEADSET_MIC leaves pin 0x19 where GET_PIN_SENSE returns 0 after
# boot until the jack is physically replugged. See README.md.
fixup=ALC256_FIXUP_HONOR_ZQC_P_M1010_MIC
status=verified
origin=this repository, measured on ZQC-P M1010
