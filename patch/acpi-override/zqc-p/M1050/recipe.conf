# HONOR MagicBook Pro 14 2026 (AI), board M1050.
#
# Pointed at M1010 rather than carrying a table of its own. The dump from this
# board in issue 11 was taken with the override already installed, so its stock
# I2C_DEVT has never been seen; what has been seen is the installer recognising
# our patched table as already active there. Nothing rests on that: the md5
# check runs on the live table before anything is written, so if this board's
# firmware ever differs the fix refuses instead of installing a foreign table.
