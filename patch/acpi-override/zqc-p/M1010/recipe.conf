# HONOR MagicBook Pro 14 2026 (AI), board M1010.
name=SSDT I2C_DEVT with TPD0 and TPL1 given _CRS and _STA
# The OEM table id to look for in the live firmware. Not a file number: acpidump
# numbers the SSDTs by boot order and that number is not stable between two
# machines, let alone two models.
oem_table_id=I2C_DEVT
# What gets installed, and the untouched table it was built from. The installer
# md5s both at run time and compares them against the live table: no hash is
# written down here, because a hash written down is a second record of a file
# that is already in the tree, free to drift out of step with it.
table=SSDT27_TPD0.aml
stock_ref=dump/acpi/zqc-p/SSDT27_orig.aml
# Which is also why a directory named after a board is safe here. It says where
# this table was measured; it does not decide what is installed. The md5 of the
# running firmware does that, and it refuses on a mismatch.
status=verified
origin=this repository, measured on ZQC-P M1010
